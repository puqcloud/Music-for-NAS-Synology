<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140902" />
      <stop offset="50%" stop-color="#241003" />
      <stop offset="100%" stop-color="#0f0601" />
    </linearGradient>

    <!-- Orange / Amber Gradients -->
    <linearGradient id="audioOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="50%" stop-color="#ff6000" />
      <stop offset="100%" stop-color="#e85d04" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1810" />
      <stop offset="50%" stop-color="#180c05" />
      <stop offset="100%" stop-color="#0d0602" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff9e00" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1000" cy="360" r="350" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="200" cy="600" r="220" fill="#ff6000" opacity="0.08" filter="url(#glow)" />

  <!-- Sound Waves in Background -->
  <g stroke="#ff7b00" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <path d="M 0 360 Q 320 280, 640 360 T 1280 360" />
    <path d="M 0 360 Q 320 440, 640 360 T 1280 360" />
    <path d="M 0 360 Q 320 200, 640 360 T 1280 360" />
    <path d="M 0 360 Q 320 520, 640 360 T 1280 360" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 160)">
    <!-- Platform Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="20" cy="19" r="6" fill="#ff7b00" />
      <text x="36" y="24" font-family="Ubuntu, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">UBUNTU TOUCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" font-family="Ubuntu, system-ui, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Music
    </text>
    <text x="0" y="145" font-family="Ubuntu, system-ui, sans-serif" font-size="34" font-weight="600" fill="#ff9e00">
      for NAS Synology
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="205" font-family="Ubuntu, system-ui, sans-serif" font-size="18" font-weight="400" fill="#f8edeb" fill-opacity="0.85">
      Stream your high-fidelity music collection from Synology Audio Station.
    </text>
    <text x="0" y="235" font-family="Ubuntu, system-ui, sans-serif" font-size="18" font-weight="400" fill="#f8edeb" fill-opacity="0.85">
      Full background audio, offline cache and sound indicator integration.
    </text>

    <!-- Features Pill Badges -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="18" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">🎵 Lossless Audio</text>
      
      <!-- Pill 2 -->
      <rect x="195" y="0" width="175" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="215" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">💾 Offline Cache</text>

      <!-- Pill 3 -->
      <rect x="385" y="0" width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="405" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">📻 Audio Station</text>
    </g>
  </g>

  <!-- Right Graphic Illustration: Music Player & Vinyl -->
  <g transform="translate(780, 130)" filter="url(#dropShadow)">

    <!-- Vinyl Record Background Effect -->
    <g transform="translate(180, 70)">
      <circle cx="160" cy="160" r="160" fill="url(#vinylGrad)" stroke="#ff7b00" stroke-opacity="0.3" stroke-width="3" />
      <!-- Vinyl Grooves -->
      <circle cx="160" cy="160" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
      <circle cx="160" cy="160" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
      <circle cx="160" cy="160" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
      <circle cx="160" cy="160" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
      <!-- Center Label -->
      <circle cx="160" cy="160" r="55" fill="url(#audioOrange)" />
      <circle cx="160" cy="160" r="14" fill="#140902" />
    </g>

    <!-- Main Player Card -->
    <g transform="translate(0, 30)">
      <rect width="330" height="420" rx="32" fill="#1f1108" stroke="url(#audioOrange)" stroke-width="2" />

      <!-- Album Art Thumbnail -->
      <g transform="translate(30, 30)">
        <rect width="270" height="180" rx="20" fill="url(#audioOrange)" />
        <!-- Music Notes & Sound Spectrum overlay on art -->
        <path d="M 60 140 L 60 70 C 60 65, 110 50, 150 60 L 150 120" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
        <circle cx="50" cy="140" r="16" fill="#ffffff" />
        <circle cx="140" cy="120" r="16" fill="#ffffff" />

        <!-- Equalizer Bars -->
        <g transform="translate(190, 100)" fill="#ffffff" fill-opacity="0.85">
          <rect x="0" y="20" width="8" height="40" rx="4" />
          <rect x="14" y="0" width="8" height="60" rx="4" />
          <rect x="28" y="30" width="8" height="30" rx="4" />
          <rect x="42" y="10" width="8" height="50" rx="4" />
          <rect x="56" y="25" width="8" height="35" rx="4" />
        </g>
      </g>

      <!-- Track Information -->
      <text x="35" y="250" font-family="Ubuntu, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Synology Lossless Stream</text>
      <text x="35" y="275" font-family="Ubuntu, system-ui, sans-serif" font-size="15" font-weight="400" fill="#ffa700">Audio Station • High Quality</text>

      <!-- Playback Progress Bar -->
      <g transform="translate(35, 300)">
        <rect width="260" height="6" rx="3" fill="#ffffff" fill-opacity="0.15" />
        <rect width="160" height="6" rx="3" fill="url(#goldGrad)" />
        <circle cx="160" cy="3" r="7" fill="#ffffff" />
        <text x="0" y="24" font-family="Ubuntu, system-ui, sans-serif" font-size="12" font-weight="500" fill="#a0aec0">02:45</text>
        <text x="260" y="24" font-family="Ubuntu, system-ui, sans-serif" font-size="12" font-weight="500" fill="#a0aec0" text-anchor="end">-01:15</text>
      </g>

      <!-- Player Controls -->
      <g transform="translate(35, 350)">
        <!-- Prev -->
        <path d="M 50 15 L 65 5 L 65 25 Z M 45 5 L 49 5 L 49 25 L 45 25 Z" fill="#ffffff" fill-opacity="0.7" />
        
        <!-- Play / Pause Circle -->
        <circle cx="130" cy="15" r="26" fill="url(#audioOrange)" />
        <path d="M 124 6 L 124 24 L 140 15 Z" fill="#ffffff" />

        <!-- Next -->
        <path d="M 200 5 L 215 15 L 200 25 Z M 216 5 L 220 5 L 220 25 L 216 25 Z" fill="#ffffff" fill-opacity="0.7" />
      </g>
    </g>

    <!-- Floating Badge: Synology DSM -->
    <g transform="translate(250, 420)">
      <rect width="140" height="42" rx="14" fill="#ff7b00" filter="url(#dropShadow)" />
      <text x="70" y="26" font-family="Ubuntu, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">DS AUDIO ♫</text>
    </g>
  </g>

</svg>
